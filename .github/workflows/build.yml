
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir -p _android_source
          unzip -q "$ZIP_FILE" -d _android_source

      - name: Find Gradle Project
        shell: bash
        run: |
          SETTINGS_FILE=$(find _android_source \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find _android_source \
              -name settings.gradle -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMMAR-APK
          path: |
            _android_source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
