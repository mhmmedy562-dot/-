
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . \
              -name settings.gradle \
              -not -path '*/.gradle/*' \
              -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found!"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
